# Prometheus configuration for OpenPlane monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "openplane"
    environment: "development"

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"
  - "recording-rules.yml"

scrape_configs:
  # Vespa metrics - native Prometheus endpoint
  - job_name: "vespa"
    scrape_interval: 15s
    metrics_path: "/prometheus/v1/values"
    static_configs:
      - targets: ["vespa:19071"]
        labels:
          service: "vespa"
          component: "search-engine"

  # Vespa JSON exporter (prometheus-community/json-exporter)
  - job_name: "vespa-json-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["vespa-exporter:9116"]
        labels:
          service: "vespa"
          component: "json-exporter"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # API server metrics
  - job_name: "server"
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["server:3000"]
        labels:
          service: "server"
          component: "api"

  # Worker metrics
  - job_name: "worker"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]
        labels:
          service: "worker"
          component: "background-processor"

  # Engine metrics (FastAPI)
  - job_name: "engine"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["engine:8000"]
        labels:
          service: "engine"
          component: "ml-service"

  # Redis exporter metrics
  - job_name: "redis-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"
          component: "cache-queue"

  # Voice agent metrics (LiveKit Agents)
  - job_name: "voice-agents"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["voice-agent-dictation:9092", "voice-agent-action:9092"]
        labels:
          service: "voice"
          component: "livekit-agents"

  # Loki metrics (needed for log-ingestion alerts)
  - job_name: "loki"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: "loki"
          component: "log-store"

  # Promtail metrics (needed for shipping/ingestion alerts)
  - job_name: "promtail"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["promtail:9080"]
        labels:
          service: "promtail"
          component: "log-shipper"
