services:
  postgres:
    image: postgres:16-alpine
    container_name: openplane-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openplane}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - openplane-network

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: openplane-server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/openplane}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openplane-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "cd /app/packages/db && bun run db:generate && cd /app/apps/server && bun run dist/index.js",
      ]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: openplane-web
    environment:
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      - server
    networks:
      - openplane-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:3001/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  fumadocs:
    build:
      context: .
      dockerfile: Dockerfile.fumadocs
    container_name: openplane-fumadocs
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${FUMADOCS_PORT:-4000}:4000"
    networks:
      - openplane-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:4000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  openplane-network:
    driver: bridge
