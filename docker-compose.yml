services:
  postgres:
    image: postgres:16-alpine
    container_name: openplane-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openplane}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.4.0-alpine
    container_name: openplane-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0-alpine
    container_name: openplane-redis-exporter
    environment:
      REDIS_ADDR: redis:6379
      REDIS_EXPORTER_CHECK_KEYS: "ratelimit:*,jobSchedulerKeys:*"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: openplane-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318" # OTLP HTTP receiver
      - "4317:4317" # OTLP gRPC receiver
    restart: unless-stopped

  vespa:
    image: vespaengine/vespa:8
    container_name: openplane-vespa
    hostname: vespa
    ports:
      - "${VESPA_PORT:-8080}:8080"
      - "${VESPA_METRICS_PORT:-19071}:19071"
    volumes:
      - vespa_data:/opt/vespa/var
      - vespa_logs:/opt/vespa/logs
    environment:
      VESPA_CONFIGSERVERS: vespa
      # Increase disk limit to 90% for development (default is 75%)
      VESPA_DISK_FULL_PERCENT: 90
    mem_limit: 4g
    memswap_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19071/state/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  vespa-deploy:
    image: alpine:latest
    container_name: openplane-vespa-deploy
    volumes:
      - ./packages/vespa:/vespa:ro
    depends_on:
      vespa:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache curl zip &&
        echo 'Waiting for Vespa to be ready...' &&
        sleep 10 &&
        cd /vespa &&
        sh ./deploy.sh vespa 19071 &&
        echo 'Vespa application deployed successfully'
      "
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: openplane-worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/openplane}
      REDIS_URL: redis://redis:6379
      VESPA_URL: http://vespa:8080
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      APP_VERSION: ${APP_VERSION:-0.1.0}
    ports:
      - "9091:9091" # Metrics
      - "9092:9092" # Health
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vespa:
        condition: service_healthy
      vespa-deploy:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: openplane-server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/openplane}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      VESPA_URL: ${VESPA_URL:-http://vespa:8080}
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      vespa-deploy:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "/app/scripts/migrate.sh && cd /app/apps/server && bun run dist/index.js",
      ]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: openplane-web
    environment:
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      - server
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:3001/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  fumadocs:
    build:
      context: .
      dockerfile: apps/fumadocs/Dockerfile
    container_name: openplane-fumadocs
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${FUMADOCS_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:4000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  vespa-exporter:
    image: quay.io/prometheuscommunity/json-exporter:latest
    container_name: openplane-vespa-exporter
    command:
      - "--config.file=/etc/json-exporter/config.yml"
    ports:
      - "9116:9116"
    volumes:
      - ./monitoring/prometheus/vespa-exporter.yml:/etc/json-exporter/config.yml:ro
    restart: unless-stopped
    depends_on:
      - vespa
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9116/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: openplane-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      - vespa-exporter
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: openplane-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-3002}
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vespa_data:
    driver: local
  vespa_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
