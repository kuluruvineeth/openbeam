services:
  engine:
    build:
      context: ./apps/engine
      dockerfile: Dockerfile
    container_name: openplane-engine
    environment:
      DEBUG: "true"
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-openplane-files}
      S3_REGION: us-east-1
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: openplane-worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/openplane}
      REDIS_URL: redis://redis:6379
      VESPA_URL: http://vespa:8080
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      APP_VERSION: ${APP_VERSION:-0.1.0}
      # Engine integration
      ENGINE_URL: http://engine:8000
      # Storage (MinIO for local dev, GCS-compatible)
      GCS_ENDPOINT: http://minio:9000
      GCS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      GCS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      GCS_BUCKET: ${S3_BUCKET:-openplane-files}
      GCS_REGION: us-east-1
    ports:
      - "9091:9091" # Metrics
      - "9092:9092" # Health
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vespa:
        condition: service_healthy
      vespa-deploy:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
      engine:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: openplane-server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/openplane}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      VESPA_URL: ${VESPA_URL:-http://vespa:8080}
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      vespa-deploy:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "/app/scripts/migrate.sh && cd /app/apps/server && bun run dist/index.js",
      ]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: openplane-web
    environment:
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      - server
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:3001/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  fumadocs:
    build:
      context: .
      dockerfile: apps/fumadocs/Dockerfile
    container_name: openplane-fumadocs
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${FUMADOCS_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:4000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
