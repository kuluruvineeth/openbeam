<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta httpEquiv="X-UA-Compatible" content="IE=edge">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    >
    <title>OpenBeam</title>
    <style id="expo-reset">
    html,
    body {
      height: 100%;
      margin: 0;
      background: #0a0a0a;
    }
    body {
      overflow: hidden;
    }
    #root {
      display: flex;
      height: 100%;
      flex: 1;
    }
    #_loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #666;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      z-index: 9999;
      transition: opacity 0.2s;
    }
    #_crash {
      display: none;
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      color: #e94560;
      font-family: monospace;
      font-size: 13px;
      padding: 40px;
      overflow: auto;
      z-index: 99999;
      white-space: pre-wrap;
      word-break: break-word;
    }
    </style>
    <script>
    "use strict";
    window.__errors = [];
    // biome-ignore lint/nursery/useMaxParams: window.onerror requires 5 params per browser API
    window.onerror = (msg, src, line, _col, err) => {
      window.__errors.push({ msg, src, line, err });
      const el = document.getElementById("_crash");
      if (el) {
        document.getElementById("_loader").style.display = "none";
        el.style.display = "block";
        el.textContent =
          "App crashed\n\n" +
          (err?.stack ? err.stack : msg) +
          "\n\nSource: " +
          (src || "unknown") +
          ":" +
          (line || "?");
      }
    };
    window.addEventListener("unhandledrejection", (e) => {
      const err = e.reason;
      window.__errors.push({ type: "unhandledrejection", err });
      const el = document.getElementById("_crash");
      if (el) {
        document.getElementById("_loader").style.display = "none";
        el.style.display = "block";
        el.textContent = `Unhandled rejection\n\n${err?.stack ? err.stack : String(err)}`;
      }
    });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="_loader">Loading…</div>
    <div id="_crash"></div>
    <script>
    "use strict";
    (() => {
      const loader = document.getElementById("_loader");
      const root = document.getElementById("root");
      function checkMount() {
        if (root.children.length > 0) {
          loader.style.opacity = "0";
          setTimeout(() => {
            loader.style.display = "none";
          }, 200);
          return;
        }
        requestAnimationFrame(checkMount);
      }
      requestAnimationFrame(checkMount);
    })();
    </script>
  </body>
</html>
