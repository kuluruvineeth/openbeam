version: 2
project_name: openplane

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: openplane
    main: ./cmd/openplane
    binary: openplane
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/openplane/openplane/apps/cli/internal/cmd/version.Version={{ .Version }} -X github.com/openplane/openplane/apps/cli/internal/cmd/version.Commit={{ .Commit }} -X github.com/openplane/openplane/apps/cli/internal/cmd/version.Date={{ .Date }}

archives:
  - id: openplane
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - docs/man/*
      - docs/completion/*

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git

release:
  prerelease: auto
