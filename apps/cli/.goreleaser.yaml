version: 2
project_name: openbeam

before:
  hooks:
    - go mod tidy
    - bash scripts/gen-docs.sh

builds:
  - id: openbeam
    main: ./cmd/openbeam
    binary: openbeam
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kuluruvineeth/openbeam/apps/cli/internal/cmd/version.Version={{ .Version }}
      - -X github.com/kuluruvineeth/openbeam/apps/cli/internal/cmd/version.Commit={{ .Commit }}
      - -X github.com/kuluruvineeth/openbeam/apps/cli/internal/cmd/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: openbeam
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README*
      - src: build/manpages/*
        dst: manpages
        strip_parent: true
      - src: build/completions/*
        dst: completions
        strip_parent: true

dockers_v2:
  - id: openbeam
    ids: [openbeam]
    images:
      - "ghcr.io/kuluruvineeth/openbeam-cli"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile

nfpms:
  - id: openbeam
    package_name: openbeam
    vendor: OpenBeam
    homepage: https://openbeam.work
    maintainer: OpenBeam <support@openbeam.work>
    description: OpenBeam CLI — enterprise search and AI assistant
    license: AGPL-3.0
    formats: [apk, deb, rpm, archlinux]
    bindir: /usr/bin
    section: utils
    contents:
      - src: build/completions/openbeam.bash
        dst: /usr/share/bash-completion/completions/openbeam
      - src: build/completions/openbeam.zsh
        dst: /usr/share/zsh/site-functions/_openbeam
      - src: build/completions/openbeam.fish
        dst: /usr/share/fish/vendor_completions.d/openbeam.fish
      - src: build/manpages/openbeam.1.gz
        dst: /usr/share/man/man1/openbeam.1.gz

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - id: cosign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  name_template: "CLI {{ .Version }}"
  prerelease: auto
  draft: false
  mode: replace
  header: |
    ## OpenBeam CLI {{ .Version }}

    ### Install

    ```sh
    # macOS / Linux
    curl -fsSL https://get.openbeam.work/install.sh | bash

    # Windows (PowerShell)
    irm https://get.openbeam.work/install.ps1 | iex

    # Homebrew (macOS, Linux)
    brew install kuluruvineeth/tap/openbeam

    # Scoop (Windows)
    scoop bucket add openbeam https://github.com/kuluruvineeth/scoop-bucket
    scoop install openbeam

    # Winget (Windows)
    winget install kuluruvineeth.openbeam

    # Docker
    docker pull ghcr.io/kuluruvineeth/openbeam-cli:{{ .Version }}
    ```

    Upgrade an existing install with `openbeam upgrade`.
    Troubleshoot with `openbeam doctor`.

    Full changelog below.
  footer: |
    ---

    **Verify this release:**

    ```sh
    # Checksum
    shasum -a 256 -c checksums.txt

    # Cosign signature (keyless OIDC)
    cosign verify-blob \
      --certificate-identity "https://github.com/kuluruvineeth/openbeam/.github/workflows/release-cli.yml@refs/tags/v{{ .Version }}" \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      --bundle checksums.txt.sigstore.json \
      checksums.txt

    # GitHub attestation (SLSA provenance)
    gh attestation verify openbeam_{{ .Version }}_linux_x86_64.tar.gz \
      --repo kuluruvineeth/openbeam
    ```

homebrew_casks:
  - name: openbeam
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_PAT "" }}true{{ else }}false{{ end }}'
    repository:
      owner: kuluruvineeth
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_PAT }}"
    homepage: https://openbeam.work
    description: OpenBeam CLI — enterprise search and AI assistant
    license: AGPL-3.0
    manpages:
      - manpages/openbeam.1.gz
    completions:
      bash: completions/openbeam.bash
      zsh: completions/openbeam.zsh
      fish: completions/openbeam.fish
    url:
      verified: github.com/kuluruvineeth/openbeam/releases/download
    hooks:
      post:
        install: |
          if OS.mac? && Hardware::CPU.arm?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/openbeam"]
          end

scoops:
  - skip_upload: '{{ if eq .Env.HOMEBREW_TAP_PAT "" }}true{{ else }}false{{ end }}'
    repository:
      owner: kuluruvineeth
      name: scoop-bucket
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_PAT }}"
    directory: bucket
    homepage: https://openbeam.work
    description: OpenBeam CLI — enterprise search and AI assistant
    license: AGPL-3.0

winget:
  - name: openbeam
    publisher: kuluruvineeth
    package_identifier: kuluruvineeth.openbeam
    short_description: OpenBeam CLI — enterprise search and AI assistant
    license: AGPL-3.0
    homepage: https://openbeam.work
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_PAT "" }}true{{ else }}false{{ end }}'
    repository:
      owner: kuluruvineeth
      name: winget-pkgs
      branch: "openbeam-{{ .Version }}"
      token: "{{ .Env.HOMEBREW_TAP_PAT }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
