apiVersion: v1
kind: Service
metadata:
  name: engine-cpu
  namespace: openbeam-engine
  labels:
    app.kubernetes.io/name: engine-cpu
    app.kubernetes.io/component: cpu-service
  annotations:
    kubernetes.io/description: "Internal service for CPU-based document processing"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: engine-cpu
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  sessionAffinity: None
