apiVersion: v1
kind: Service
metadata:
  name: engine-gpu
  namespace: openbeam-engine
  labels:
    app.kubernetes.io/name: engine-gpu
    app.kubernetes.io/component: gpu-service
  annotations:
    kubernetes.io/description: "Internal service for GPU-based ML inference"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: engine-gpu
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP
    - name: ray-dashboard
      port: 8265
      targetPort: ray-dashboard
      protocol: TCP
  sessionAffinity: None
