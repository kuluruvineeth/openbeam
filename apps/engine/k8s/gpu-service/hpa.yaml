apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engine-gpu
  namespace: openbeam-engine
  labels:
    app.kubernetes.io/name: engine-gpu
    app.kubernetes.io/component: gpu-service
  annotations:
    kubernetes.io/description: "Conservative autoscaler for GPU service - GPU resources are expensive"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engine-gpu
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Max
