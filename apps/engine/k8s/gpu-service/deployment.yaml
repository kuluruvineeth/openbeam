apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-gpu
  namespace: openbeam-engine
  labels:
    app.kubernetes.io/name: engine-gpu
    app.kubernetes.io/component: gpu-service
    app.kubernetes.io/part-of: openbeam
  annotations:
    kubernetes.io/description: "GPU service for embeddings, reranking, and entity extraction via Ray Serve"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: engine-gpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine-gpu
        app.kubernetes.io/component: gpu-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: engine-gpu
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine-gpu
          image: openbeam/engine-gpu:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
            - name: ray-dashboard
              containerPort: 8265
              protocol: TCP
            - name: ray-gcs
              containerPort: 6379
              protocol: TCP
          env:
            - name: GPU_PORT
              value: "8001"
            - name: GPU_PROVIDER_TYPE
              value: "ray_serve"
            - name: GPU_MODEL_CACHE_DIR
              value: "/models"
            - name: GPU_EMBEDDING_MODEL
              value: "BAAI/bge-m3"
            - name: GPU_EMBEDDING_BATCH_SIZE
              value: "32"
            - name: GPU_RERANKER_MODEL
              value: "BAAI/bge-reranker-v2-m3"
            - name: GPU_RERANKER_BATCH_SIZE
              value: "16"
            - name: GPU_ENTITY_MODEL
              value: "urchade/gliner_multi_pii-v1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: RAY_GRAFANA_IFRAME_HOST
              value: "http://grafana.monitoring.svc.cluster.local:3000"
            - name: RAY_PROMETHEUS_HOST
              value: "http://prometheus.monitoring.svc.cluster.local:9090"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /-/healthz
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /-/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: ray-tmp
              mountPath: /tmp/ray
            - name: cache
              mountPath: /.cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: engine-gpu-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
        - name: ray-tmp
          emptyDir:
            sizeLimit: 5Gi
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: cloud.google.com/gke-accelerator
          operator: Exists
          effect: NoSchedule
