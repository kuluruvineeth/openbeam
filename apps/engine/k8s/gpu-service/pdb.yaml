apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: engine-gpu
  namespace: openbeam-engine
  labels:
    app.kubernetes.io/name: engine-gpu
    app.kubernetes.io/component: gpu-service
  annotations:
    kubernetes.io/description: "Allows voluntary disruptions only when multiple replicas exist"
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: engine-gpu
