apiVersion: v1
kind: ResourceQuota
metadata:
  name: engine-quota
  namespace: openplane-engine
  labels:
    app.kubernetes.io/name: openplane-engine
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    limits.cpu: "200"
    limits.memory: 400Gi
    requests.nvidia.com/gpu: "10"
    persistentvolumeclaims: "10"
    pods: "100"
    services: "20"
