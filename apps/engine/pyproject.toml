[project]
name = "engine"
version = "0.2.0"
description = "OpenPlane Engine - Modular document processing and ML compute service"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"

dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "prometheus-client>=0.21.0",
    "cachetools>=5.5.0",
]

[project.optional-dependencies]
cpu = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "unstructured[all-docs]>=0.16.0",
    "python-multipart>=0.0.17",
    "aioboto3>=13.0.0",
    "types-aiobotocore-s3>=2.15.0",
    "lightgbm>=4.5.0",
    "rapidfuzz>=3.10.0",
    "diskcache>=5.6.0",
]

gpu = [
    "ray[serve]>=2.40.0",
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "FlagEmbedding>=1.2.0",
    "sentence-transformers>=3.3.0",
    "gliner>=0.2.0",
    "accelerate>=1.2.0",
]

gpu-modal = [
    "modal>=0.66.0",
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "FlagEmbedding>=1.2.0",
    "sentence-transformers>=3.3.0",
    "gliner>=0.2.0",
]

dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.1.0",
    "hypothesis>=6.122.0",
    "respx>=0.22.0",
    "fakeredis>=2.26.0",
]

[project.scripts]
engine-cpu = "engine.cpu_service.main:run"
engine-gpu = "engine.gpu_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "PERF",   # Perflint
    "ASYNC",  # flake8-async
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "FURB",   # refurb
    "LOG",    # flake8-logging
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "TRY003",  # long exception messages
    "TRY400",  # logger.error vs logger.exception (we prefer explicit error messages)
    "S101",    # assert usage (needed in tests)
    "S104",    # binding to all interfaces (intentional for servers)
    "S108",    # temp directory (we use a dedicated engine temp dir)
    "S110",    # try-except-pass (intentional for health checks)
    "B008",    # Depends() in defaults (FastAPI standard pattern)
    "TC001",   # application imports in type-checking (needed at runtime)
    "TC002",   # third-party imports in type-checking (needed at runtime)
    "TC003",   # stdlib imports in type-checking (needed at runtime)
    "TC006",   # quotes in cast (pydantic models need unquoted)
    "PLC0415", # import not at top-level (delayed imports for heavy ML libs)
    "PERF401", # list.extend vs append (readability over micro-optimization)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG001"]
"src/engine/gpu_service/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["engine"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "aiobotocore.*",
    "FlagEmbedding.*",
    "sentence_transformers.*",
    "gliner.*",
    "unstructured.*",
    "ray.*",
    "modal.*",
    "lightgbm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests requiring GPU",
    "benchmark: marks tests as benchmark tests",
    "property: marks tests as property-based tests",
]

[tool.coverage.run]
source = ["src/engine"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]
