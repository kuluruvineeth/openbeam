port: 7880
bind_addresses:
  - ""

keys:
  openbeam_voice: ${LIVEKIT_API_SECRET}

rtc:
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  use_external_ip: true
  enable_loopback_candidate: false

turn:
  enabled: true
  domain: turn.openbeam.dev
  tls_port: 5349
  udp_port: 3478

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 10

webhook:
  urls:
    - https://api.openbeam.dev/webhooks/livekit
  api_key: openbeam_voice

logging:
  level: info
  pion_level: warn

limit:
  num_tracks: 50
  bytes_per_sec: 10485760
