# In-cluster PostgreSQL for dev/pilot
# Used because Azure PostgreSQL Flexible Server is subscription-restricted
# For production: request quota increase at https://aka.ms/postgres-request-quota-increase

auth:
  username: pgadmin
  database: openbeam
  existingSecret: postgresql-credentials
  secretKeys:
    adminPasswordKey: password
    userPasswordKey: password

primary:
  persistence:
    enabled: true
    size: 20Gi
    storageClass: managed-csi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  extendedConfiguration: |
    max_connections = 200
    shared_buffers = 512MB
    work_mem = 16MB
    maintenance_work_mem = 256MB
    effective_cache_size = 1536MB
    wal_buffers = 16MB
    checkpoint_completion_target = 0.9
    random_page_cost = 1.1

# Additional databases created via initdb scripts
primary:
  initdb:
    scripts:
      create-databases.sql: |
        CREATE DATABASE temporal;
        CREATE DATABASE temporal_visibility;
