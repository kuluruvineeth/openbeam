# In-cluster Redis for dev/pilot
# Saves ~$25/mo vs Azure Redis PaaS

architecture: standalone

auth:
  enabled: true
  existingSecret: redis-credentials
  existingSecretPasswordKey: password

master:
  persistence:
    enabled: true
    size: 2Gi
    storageClass: managed-csi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  configuration: |
    maxmemory 400mb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10

replica:
  replicaCount: 0
