[tools]
bun = "1.3.2"
node = "22"
python = "3.12"
go = "1.24"
"ubi:astral-sh/uv" = "latest"

[tasks.dev]
description = "Start all services"
run = "bun run dev"

[tasks.check]
description = "Run all quality checks"
run = "just check-all"

[tasks.test]
description = "Run all tests"
run = "just test"

[tasks.install]
description = "Install all dependencies"
run = "just install"
