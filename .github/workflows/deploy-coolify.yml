name: "Hetzner: Website & Docs"

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/website/**"
      - "apps/docs/**"
      - "packages/ui/**"
      - "packages/integrations/**"
      - "packages/types/**"
      - "Dockerfile.base"
      - ".github/workflows/deploy-coolify.yml"
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy'
        required: true
        default: "all"
        type: choice
        options:
          - all
          - website
          - docs

concurrency:
  group: deploy-coolify-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kuluruvineeth/openbeam

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
      base_changed: ${{ steps.matrix.outputs.base_changed }}
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            base:
              - 'Dockerfile.base'
            website:
              - 'apps/website/**'
              - 'packages/ui/**'
              - 'packages/integrations/**'
              - 'packages/types/**'
              - 'package.json'
              - 'bun.lock'
            docs:
              - 'apps/docs/**'
              - 'package.json'
              - 'bun.lock'

      - name: Build matrix
        id: matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT="${{ inputs.services }}"
            if [[ "$INPUT" == "all" ]]; then
              echo 'services=["website","docs"]' >> $GITHUB_OUTPUT
            else
              echo "services=[\"${INPUT}\"]" >> $GITHUB_OUTPUT
            fi
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "base_changed=false" >> $GITHUB_OUTPUT
          else
            SERVICES="[]"
            HAS_CHANGES="false"
            BASE="${{ steps.filter.outputs.base }}"
            [[ "${{ steps.filter.outputs.website }}" == "true" || "$BASE" == "true" ]] && SERVICES=$(echo "$SERVICES" | jq -c '. + ["website"]') && HAS_CHANGES="true"
            [[ "${{ steps.filter.outputs.docs }}" == "true" || "$BASE" == "true" ]] && SERVICES=$(echo "$SERVICES" | jq -c '. + ["docs"]') && HAS_CHANGES="true"
            echo "services=$SERVICES" >> $GITHUB_OUTPUT
            echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
            echo "base_changed=$BASE" >> $GITHUB_OUTPUT
          fi

  build-base:
    name: Build Base Image
    needs: changes
    if: needs.changes.outputs.base_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-base:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          provenance: false

  build:
    name: "Build: ${{ matrix.service }}"
    needs: [changes, build-base]
    if: |
      always() &&
      needs.changes.outputs.has_changes == 'true' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure HugeIcons
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com/" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}" >> .npmrc

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ needs.changes.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
          build-args: |
            HUGEICONS_PRO_AUTH_TOKEN=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}

  deploy:
    name: Deploy to Hetzner
    needs: [changes, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on Hetzner
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SERVER_IP: ${{ secrets.HETZNER_SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -o ServerAliveInterval=30 "root@$SERVER_IP" \
            "cd /data/openbeam && docker compose pull && docker compose up -d --force-recreate"

      - name: Verify deployment
        run: |
          sleep 15
          WEBSITE=$(curl -s -o /dev/null -w "%{http_code}" https://openbeam.work 2>/dev/null || echo "000")
          DOCS=$(curl -s -o /dev/null -w "%{http_code}" https://docs.openbeam.work 2>/dev/null || echo "000")

          echo "## Hetzner Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Site | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| [openbeam.work](https://openbeam.work) | HTTP ${WEBSITE} |" >> $GITHUB_STEP_SUMMARY
          echo "| [docs.openbeam.work](https://docs.openbeam.work) | HTTP ${DOCS} |" >> $GITHUB_STEP_SUMMARY
