name: Deploy Services

on:
  # Manual trigger only - uncomment below for auto-trigger after Docker build
  # workflow_run:
  #   workflows: ["Build and Push Docker Images"]
  #   types: [completed]
  #   branches: [main, dev]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      GCP_SA_KEY:
        required: true
      GCP_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]
      services:
        description: 'Services to deploy (comma-separated: server,worker,web or "all")'
        required: true
        default: "all"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev'))
    outputs:
      environment: ${{ steps.env.outputs.ENV }}
      image_tag: ${{ steps.env.outputs.IMAGE_TAG }}
      should_migrate: ${{ steps.check_migration.outputs.should_migrate }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            echo "ENV=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ENV=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "ENV=dev" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Check if migrations needed
        id: check_migration
        run: |
          # For manual dispatch, always allow migrations
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_migrate=true" >> $GITHUB_OUTPUT
            echo "Manual deployment - migrations will run"
            exit 0
          fi

          # Check if Prisma schema or migrations changed
          if git diff --name-only HEAD~1 HEAD | grep -E '^packages/db/prisma/(schema|migrations)/|prisma\.config\.ts'; then
            echo "should_migrate=true" >> $GITHUB_OUTPUT
            echo "Database schema changes detected - migrations will run"
          else
            echo "should_migrate=false" >> $GITHUB_OUTPUT
            echo "No database changes detected - skipping migrations"
          fi

  migrate:
    needs: prepare
    if: needs.prepare.outputs.should_migrate == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/run-migrations.yml
    with:
      environment: ${{ needs.prepare.outputs.environment }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

  deploy:
    needs: [prepare, migrate]
    if: always() && needs.prepare.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [server, worker, web]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: should_deploy
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SERVICES="${{ inputs.services }}"
            [[ "$SERVICES" == "all" || "$SERVICES" == *"${{ matrix.service }}"* ]] && echo "deploy=true" >> $GITHUB_OUTPUT || echo "deploy=false" >> $GITHUB_OUTPUT
          else
            echo "deploy=true" >> $GITHUB_OUTPUT
          fi

      - if: steps.should_deploy.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - if: steps.should_deploy.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.should_deploy.outputs.deploy == 'true'
        id: resolve_image
        run: |
          BASE_IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/openplane-repo/openplane-${{ matrix.service }}
          IMAGE_TAG=${{ needs.prepare.outputs.image_tag }}

          echo "Resolving image for ${{ matrix.service }} (commit: ${IMAGE_TAG})"

          # Try commit SHA tag first
          if gcloud artifacts docker images describe ${BASE_IMAGE}:${IMAGE_TAG} --format=json 2>/dev/null; then
            IMAGE="${BASE_IMAGE}:${IMAGE_TAG}"
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "image=${IMAGE}" >> $GITHUB_OUTPUT
            echo "Using commit-specific image: ${IMAGE}"
          # Fall back to latest tag
          elif gcloud artifacts docker images describe ${BASE_IMAGE}:latest --format=json 2>/dev/null; then
            IMAGE="${BASE_IMAGE}:latest"
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "image=${IMAGE}" >> $GITHUB_OUTPUT
            echo "Commit image not found, falling back to latest"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::error::No images found for ${{ matrix.service }}. Please build images first."
            exit 1
          fi

      - if: steps.should_deploy.outputs.deploy == 'true' && steps.resolve_image.outputs.exists == 'true'
        name: Deploy service
        timeout-minutes: 10
        run: |
          gcloud run services update openplane-${{ matrix.service }}-${{ needs.prepare.outputs.environment }} \
            --image=${{ steps.resolve_image.outputs.image }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet

      - if: steps.should_deploy.outputs.deploy == 'true' && steps.resolve_image.outputs.exists == 'true'
        timeout-minutes: 5
        run: |
          SVC=openplane-${{ matrix.service }}-${{ needs.prepare.outputs.environment }}
          for i in {1..30}; do
            STATUS=$(gcloud run services describe $SVC --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} --format='value(status.conditions[0].status)')
            [[ "$STATUS" == "True" ]] && exit 0
            sleep 10
          done
          exit 1

      - if: failure() && steps.should_deploy.outputs.deploy == 'true' && steps.resolve_image.outputs.exists == 'true'
        run: |
          SVC=openplane-${{ matrix.service }}-${{ needs.prepare.outputs.environment }}
          PREV=$(gcloud run revisions list --service=$SVC --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} --format='value(name)' --filter='status.conditions.status=True' --limit=1)
          [[ -n "$PREV" ]] && gcloud run services update-traffic $SVC --to-revisions=$PREV=100 --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }}
