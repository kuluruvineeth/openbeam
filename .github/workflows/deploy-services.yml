name: Deploy Services

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]
      services:
        description: 'Services to deploy (comma-separated: server,worker,web or "all")'
        required: true
        default: "all"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev'))
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [server, worker, web]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ENV=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "ENV=dev" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

      - id: should_deploy
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SERVICES="${{ inputs.services }}"
            [[ "$SERVICES" == "all" || "$SERVICES" == *"${{ matrix.service }}"* ]] && echo "deploy=true" >> $GITHUB_OUTPUT || echo "deploy=false" >> $GITHUB_OUTPUT
          else
            echo "deploy=true" >> $GITHUB_OUTPUT
          fi

      - if: steps.should_deploy.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - if: steps.should_deploy.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.should_deploy.outputs.deploy == 'true'
        id: resolve_image
        run: |
          BASE_IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/openplane-repo/openplane-${{ matrix.service }}
          IMAGE_TAG=${{ steps.env.outputs.IMAGE_TAG }}

          echo "Resolving image for ${{ matrix.service }} (commit: ${IMAGE_TAG})"

          # Try commit SHA tag first
          if gcloud artifacts docker images describe ${BASE_IMAGE}:${IMAGE_TAG} --format=json 2>/dev/null; then
            IMAGE="${BASE_IMAGE}:${IMAGE_TAG}"
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "image=${IMAGE}" >> $GITHUB_OUTPUT
            echo "Using commit-specific image: ${IMAGE}"
          # Fall back to latest tag
          elif gcloud artifacts docker images describe ${BASE_IMAGE}:latest --format=json 2>/dev/null; then
            IMAGE="${BASE_IMAGE}:latest"
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "image=${IMAGE}" >> $GITHUB_OUTPUT
            echo "Commit image not found, falling back to latest"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::error::No images found for ${{ matrix.service }}. Please build images first."
            exit 1
          fi

      - if: steps.should_deploy.outputs.deploy == 'true' && steps.resolve_image.outputs.exists == 'true'
        timeout-minutes: 10
        run: |
          gcloud run services update openplane-${{ matrix.service }}-${{ steps.env.outputs.ENV }} \
            --image=${{ steps.resolve_image.outputs.image }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet

      - if: steps.should_deploy.outputs.deploy == 'true' && steps.resolve_image.outputs.exists == 'true'
        timeout-minutes: 5
        run: |
          SVC=openplane-${{ matrix.service }}-${{ steps.env.outputs.ENV }}
          for i in {1..30}; do
            STATUS=$(gcloud run services describe $SVC --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} --format='value(status.conditions[0].status)')
            [[ "$STATUS" == "True" ]] && exit 0
            sleep 10
          done
          exit 1

      - if: failure() && steps.should_deploy.outputs.deploy == 'true' && steps.resolve_image.outputs.exists == 'true'
        run: |
          SVC=openplane-${{ matrix.service }}-${{ steps.env.outputs.ENV }}
          PREV=$(gcloud run revisions list --service=$SVC --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} --format='value(name)' --filter='status.conditions.status=True' --limit=1)
          [[ -n "$PREV" ]] && gcloud run services update-traffic $SVC --to-revisions=$PREV=100 --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }}
