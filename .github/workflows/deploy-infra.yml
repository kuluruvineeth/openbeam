name: Deploy Infrastructure

on:
  # Manual trigger only - uncomment below for auto-trigger on infra changes
  # push:
  #   branches: [main, dev]
  #   paths:
  #     - "infra/terraform/**"
  #     - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:
    inputs:
      skip_service_update:
        description: "Skip updating service images (for infra-only changes)"
        type: boolean
        default: false

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.9.0
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
  TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
  TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  TF_VAR_encryption_key: ${{ secrets.ENCRYPTION_KEY }}
  TF_VAR_server_domain: ${{ secrets.SERVER_DOMAIN }}
  TF_VAR_web_domain: ${{ secrets.WEB_DOMAIN }}
  TF_VAR_cookie_domain: ${{ secrets.COOKIE_DOMAIN }}
  TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
  TF_VAR_openai_base_url: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
  TF_VAR_openai_organization: ${{ vars.OPENAI_ORGANIZATION || '' }}
  TF_VAR_gcs_access_key: ${{ secrets.GCS_ACCESS_KEY }}
  TF_VAR_gcs_secret_key: ${{ secrets.GCS_SECRET_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      environment: ${{ steps.env.outputs.ENV }}
      image_tag: ${{ steps.resolve_image_tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: env
        run: |
          ENV=$([[ "${{ github.ref }}" == "refs/heads/main" ]] && echo prod || echo dev)
          echo "ENV=${ENV}" >> $GITHUB_OUTPUT

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - id: resolve_image_tag
        run: |
          IMAGE_TAG="${{ github.sha }}"
          BASE_IMAGE="us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/openplane-repo/openplane-server"

          echo "Resolving image tag (commit: ${IMAGE_TAG})"

          # For infra-only changes, try commit SHA then fall back to latest
          if gcloud artifacts docker images describe ${BASE_IMAGE}:${IMAGE_TAG} --format=json 2>/dev/null; then
            echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
            echo "Using commit-specific images: ${IMAGE_TAG}"
          elif gcloud artifacts docker images describe ${BASE_IMAGE}:latest --format=json 2>/dev/null; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "::warning::Using 'latest' tag. Infrastructure-only change deploying with existing code."
          else
            echo "::error::No Docker images found. Please run Docker build workflow first."
            exit 1
          fi

      - working-directory: infra/terraform/environments/${{ steps.env.outputs.ENV }}
        run: terraform init

      - working-directory: infra/terraform/environments/${{ steps.env.outputs.ENV }}
        env:
          TF_VAR_redeploy_id: ${{ steps.resolve_image_tag.outputs.tag }}
          TF_VAR_image_tag: ${{ steps.resolve_image_tag.outputs.tag }}
          TF_VAR_server_domain: ${{ secrets.SERVER_DOMAIN }}
          TF_VAR_web_domain: ${{ secrets.WEB_DOMAIN }}
        run: terraform plan -no-color
        continue-on-error: true

      - if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        working-directory: infra/terraform/environments/${{ steps.env.outputs.ENV }}
        env:
          TF_VAR_redeploy_id: ${{ steps.resolve_image_tag.outputs.tag }}
          TF_VAR_image_tag: ${{ steps.resolve_image_tag.outputs.tag }}
          TF_VAR_server_domain: ${{ secrets.SERVER_DOMAIN }}
          TF_VAR_web_domain: ${{ secrets.WEB_DOMAIN }}
        run: terraform apply -auto-approve -input=false
