name: Deploy Infrastructure

on:
  push:
    branches: [main, dev]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

env:
  TF_VERSION: 1.9.0
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
  TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
  TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: env
        run: echo "ENV=$([[ "${{ github.ref }}" == "refs/heads/main" ]] && echo prod || echo dev)" >> $GITHUB_OUTPUT

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - id: resolve_image_tag
        run: |
          IMAGE_TAG="${{ github.sha }}"
          BASE_IMAGE="us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/openplane-repo/openplane-server"

          echo "Resolving image tag (commit: ${IMAGE_TAG})"

          # Try commit SHA tag first
          if gcloud artifacts docker images describe ${BASE_IMAGE}:${IMAGE_TAG} --format=json 2>/dev/null; then
            echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
            echo "Using commit-specific images: ${IMAGE_TAG}"
          # Fall back to latest tag
          elif gcloud artifacts docker images describe ${BASE_IMAGE}:latest --format=json 2>/dev/null; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "Commit images not found, falling back to: latest"
          else
            echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
            echo "No images found. Using placeholder: ${IMAGE_TAG}. Services may fail to deploy."
          fi

      - working-directory: infra/terraform/environments/${{ steps.env.outputs.ENV }}
        run: terraform init

      - working-directory: infra/terraform/environments/${{ steps.env.outputs.ENV }}
        env:
          TF_VAR_redeploy_id: ${{ steps.resolve_image_tag.outputs.tag }}
          TF_VAR_image_tag: ${{ steps.resolve_image_tag.outputs.tag }}
        run: terraform plan -no-color
        continue-on-error: true

      - if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        working-directory: infra/terraform/environments/${{ steps.env.outputs.ENV }}
        env:
          TF_VAR_redeploy_id: ${{ steps.resolve_image_tag.outputs.tag }}
          TF_VAR_image_tag: ${{ steps.resolve_image_tag.outputs.tag }}
        run: terraform apply -auto-approve -input=false

      - if: success()
        working-directory: infra/terraform/environments/${{ steps.env.outputs.ENV }}
        run: |
          if terraform show -json | grep -q "module.server\|module.worker\|module.web"; then
            for svc in server worker web; do
              IMG=$(terraform output -raw ${svc}_image 2>/dev/null || echo "")
              [[ -n "$IMG" ]] && gcloud run services update openplane-${svc}-${{ steps.env.outputs.ENV }} --image=$IMG --region=us-central1 --project=${{ env.GCP_PROJECT_ID }} --quiet || true
            done
          fi
        continue-on-error: true
