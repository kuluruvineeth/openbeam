name: "Publish: SDK"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: false
        type: string
        default: "latest"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @openbeam/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Configure npm auth
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com/" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}" >> .npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: cd packages/sdk && bun run typecheck

      - name: Build package
        run: cd packages/sdk && bun run build

      - name: Verify dist output
        run: |
          test -f packages/sdk/dist/index.js || (echo "Missing dist/index.js" && exit 1)
          test -f packages/sdk/dist/index.d.ts || (echo "Missing dist/index.d.ts" && exit 1)

      - name: Prepare package for publish
        run: |
          cd packages/sdk
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('./package.json', 'utf8'));
            pkg.version = '${{ inputs.version }}';
            delete pkg.devDependencies;
            writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to npm
        working-directory: packages/sdk
        run: npm publish --access public --tag ${{ inputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "## Published @openbeam/sdk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ inputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ inputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Install** | \`npm i @openbeam/sdk\` |" >> $GITHUB_STEP_SUMMARY
