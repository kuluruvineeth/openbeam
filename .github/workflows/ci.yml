name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    lint-and-typecheck:
        name: Lint and Type Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting
              run: bun x ultracite fix --check

            - name: Type check
              run: bun run check-types

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build all packages
              run: bun run build
