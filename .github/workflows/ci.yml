name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
      docs: ${{ steps.filter.outputs.docs }}
      mobile: ${{ steps.filter.outputs.mobile }}
      observability: ${{ steps.filter.outputs.observability }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - 'apps/**/*.ts'
              - 'apps/**/*.tsx'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'package.json'
              - 'bun.lock'
            python:
              - 'apps/engine/**'
            go:
              - 'apps/cli/**'
            docs:
              - 'apps/docs/**'
              - '**/*.md'
            mobile:
              - 'apps/mobile/**'
            observability:
              - 'monitoring/**'
              - 'scripts/observability/**'
              - 'docs/observability/**'
              - 'packages/observability/**'
            ci:
              - '.github/workflows/**'

  lint-and-typecheck:
    name: Lint & Type Check
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com/" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}" >> .npmrc

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun x ultracite check

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Type Check
        run: bun x turbo check-types --filter='!engine'

  mobile-check:
    name: Mobile Lint & Type Check
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com/" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}" >> .npmrc

      - run: bun install --frozen-lockfile

      - name: Type Check
        run: cd apps/mobile && bun run check-types

      - name: Lint
        run: cd apps/mobile && bun run lint

  build:
    name: Build
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com/" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}" >> .npmrc

      - run: bun install --frozen-lockfile

      - name: Build All Packages
        run: bun x turbo build --filter='!@openbeam/desktop'

  test-typescript:
    name: Test (TypeScript)
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com/" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}" >> .npmrc

      - run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Run Tests
        run: bun test --coverage

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-typescript
          path: coverage/
          retention-days: 7

  test-temporal:
    name: Test (Temporal)
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com/" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}" >> .npmrc

      - run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Run Temporal Tests
        run: cd packages/temporal && bun run test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  test-python:
    name: Test (Python)
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install Dependencies
        working-directory: apps/engine
        run: uv sync --extra cpu --extra dev

      - name: Run Tests
        working-directory: apps/engine
        run: uv run pytest tests/ -v --cov=src/engine --cov-report=xml --cov-fail-under=70

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: apps/engine/coverage.xml
          retention-days: 7

  test-go:
    name: Test (Go)
    needs: detect-changes
    if: needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/cli/go.sum

      - name: Run Tests
        working-directory: apps/cli
        run: go test ./... -v -coverprofile=coverage.out

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: apps/cli/coverage.out
          retention-days: 7

  security:
    name: Security Scan
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.python == 'true' || needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  observability-validate:
    name: Observability Validate
    needs: detect-changes
    if: needs.detect-changes.outputs.observability == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com/" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}" >> .npmrc

      - run: bun install --frozen-lockfile

      - name: Validate Dashboards and Rules
        run: bun run observability:validate

      - name: Start Monitoring Stack (Infra)
        run: docker compose -f docker-compose.infra.yml up -d --remove-orphans

      - name: Wait For Core Monitoring Endpoints
        run: |
          set -euo pipefail
          wait_for() {
            local url="$1"
            local name="$2"
            for _ in {1..60}; do
              if curl -sf "$url" >/dev/null 2>&1; then
                echo "$name is ready"
                return 0
              fi
              sleep 2
            done
            echo "$name did not become ready in time"
            return 1
          }
          wait_for "http://localhost:9090/-/healthy" "Prometheus"
          wait_for "http://localhost:3002/api/health" "Grafana"
          wait_for "http://localhost:3100/ready" "Loki"

      - name: Monitoring Smoke Test (Infra Profile)
        env:
          MONITORING_SMOKE_MODE: infra
          MONITORING_SMOKE_STRICT: "1"
        run: bun run observability:smoke

      - name: Stop Monitoring Stack
        if: always()
        run: docker compose -f docker-compose.infra.yml down -v --remove-orphans

  observability-contract:
    name: Observability Contract
    needs: detect-changes
    if: needs.detect-changes.outputs.observability == 'true' || needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com/" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}" >> .npmrc

      - run: bun install --frozen-lockfile

      - name: Validate Logger Contract Keys
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          NODE_ENV=production bun -e '
            import {
              createLogger,
              runWithRequestContext,
            } from "./packages/observability/src/index.ts";

            const logger = createLogger({
              service: "openbeam-contract",
              env: "production",
              version: "ci",
            });

            runWithRequestContext(
              {
                requestId: "req-contract",
                method: "GET",
                path: "/health",
                route: "/health",
                teamId: "team-contract",
                userId: "user-contract",
              },
              () => {
                logger.error(
                  {
                    status_code: 500,
                    error_code: "contract_probe_error",
                  },
                  "contract_probe"
                );
              }
            );
          ' > "$log_file"

          jq -e '
            has("time") and
            has("level") and
            has("service") and
            has("env") and
            has("version") and
            has("request_id") and
            (.request_id == "req-contract") and
            ((.message // .msg // "") | length > 0)
          ' "$log_file" >/dev/null

      - name: Validate Forbidden High-Cardinality Labels
        run: |
          set -euo pipefail
          forbidden='request_id|trace_id|span_id|user_id|team_id|connector_id|document_id|file_id'
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              range="$before...${{ github.sha }}"
            else
              empty_tree="$(git hash-object -t tree /dev/null)"
              range="$empty_tree...${{ github.sha }}"
            fi
          fi

          changed_metric_files="$(git diff --name-only "$range" -- 'apps/**/*.ts' 'packages/**/*.ts' | rg '(metrics|instrumentation).*\\.ts$' || true)"

          if [[ -z "$changed_metric_files" ]]; then
            echo "No changed metrics/instrumentation TypeScript files."
            exit 0
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if git diff --unified=0 "$range" -- "$file" | rg -n "^\+.*\\b(${forbidden})\\b"; then
              echo "Forbidden high-cardinality label introduced in $file"
              exit 1
            fi
          done <<< "$changed_metric_files"

          echo "No forbidden high-cardinality labels introduced in changed metric definitions."
