name: Build and Push Docker Images

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  # Google Artifact Registry
  # Replace these with your actual values or secrets
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GAR_REPOSITORY: openplane-repo
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
              - 'packages/api/**'
              - 'packages/auth/**'
              - 'packages/db/**'
              - 'packages/redis/**'
              - 'Dockerfile.server'
              - 'apps/server/Dockerfile'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            web:
              - 'apps/web/**'
              - 'packages/api/**'
              - 'packages/auth/**'
              - 'packages/db/**'
              - 'packages/integrations/**'
              - 'Dockerfile.web'
              - 'apps/web/Dockerfile'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            fumadocs:
              - 'apps/fumadocs/**'
              - 'Dockerfile.fumadocs'
              - 'apps/fumadocs/Dockerfile'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            worker:
              - 'apps/worker/**'
              - 'packages/redis/**'
              - 'packages/db/**'
              - 'packages/vespa/**'
              - 'packages/integrations/**'
              - 'apps/worker/Dockerfile'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'

      - name: Set Matrix
        id: set-matrix
        run: |
          # Initialize empty array
          MATRIX="[]"
          HAS_CHANGES="false"

          # Check triggers and append to matrix
          if [ "${{ steps.filter.outputs.server }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MATRIX=$(echo $MATRIX | jq '. + ["server"]')
            HAS_CHANGES="true"
          fi

          if [ "${{ steps.filter.outputs.web }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MATRIX=$(echo $MATRIX | jq '. + ["web"]')
            HAS_CHANGES="true"
          fi

          if [ "${{ steps.filter.outputs.fumadocs }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MATRIX=$(echo $MATRIX | jq '. + ["fumadocs"]')
            HAS_CHANGES="true"
          fi

          if [ "${{ steps.filter.outputs.worker }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MATRIX=$(echo $MATRIX | jq '. + ["worker"]')
            HAS_CHANGES="true"
          fi

          # Output compact JSON
          echo "matrix={\"service\":$(echo $MATRIX | jq -c .)}" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation
      security-events: write # Required for uploading SARIF results

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure npm registry for HugeIcons Pro
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com/" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}" >> .npmrc

      # Authenticate to Google Cloud
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          # Use Workload Identity Federation (Recommended)
          # workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          # service_account: 'my-service-account@my-project.iam.gserviceaccount.com'

          # OR use Service Account Key JSON (Easier for initial setup)
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/openplane-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: Determine Dockerfile path
        id: dockerfile
        run: |
          if [ -f "./apps/${{ matrix.service }}/Dockerfile" ]; then
            echo "path=./apps/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=./Dockerfile.${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        id: build
        env:
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL_WEB }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ env.NEXT_PUBLIC_SERVER_URL }}
            HUGEICONS_PRO_AUTH_TOKEN=${{ secrets.HUGEICONS_PRO_AUTH_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/openplane-${{ matrix.service }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret,misconfig"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
