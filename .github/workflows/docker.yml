name: Build and Push Docker Images

on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    # BuildKit for faster builds
    DOCKER_BUILDKIT: 1
    COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
    build-and-push:
        name: Build and Push Images
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Only run if:
        # - Manually triggered (workflow_dispatch), OR
        # - CI workflow succeeded (workflow_run with success)
        if: |
            github.event_name == 'workflow_dispatch' || 
            (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        permissions:
            contents: read
            packages: write

        strategy:
            matrix:
                service:
                    - server
                    - web
                    - fumadocs

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch full history for git diff

            - name: Detect changes
              id: changes
              run: |
                  set -euo pipefail

                  # Get the base and head commits
                  if [ "${{ github.event_name }}" == "workflow_run" ]; then
                      # For workflow_run, checkout the specific commit and compare with previous
                      HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
                      git checkout "$HEAD_SHA" 2>/dev/null || true
                      # Get the merge base or previous commit
                      BASE_SHA=$(git merge-base "$HEAD_SHA" origin/main 2>/dev/null || git rev-parse "$HEAD_SHA~1" 2>/dev/null || echo "$HEAD_SHA")
                  elif [ "${{ github.event_name }}" == "push" ]; then
                      # For tag pushes, compare with previous commit
                      HEAD_SHA="${{ github.sha }}"
                      BASE_SHA=$(git rev-parse "$HEAD_SHA~1" 2>/dev/null || echo "$HEAD_SHA")
                  else
                      # For manual dispatch, compare with previous commit
                      HEAD_SHA=$(git rev-parse HEAD)
                      BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "$HEAD_SHA")
                  fi

                  # Check which services have changes
                  if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
                      # If base equals head (first commit or no history), check all files
                      CHANGED_FILES=$(git ls-tree -r --name-only HEAD)
                  else
                      CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "")
                  fi

                  # Determine which services need to be built
                  SERVER_CHANGED=false
                  WEB_CHANGED=false
                  FUMADOCS_CHANGED=false

                  # Server changes: apps/server, packages/api, packages/auth, packages/db, Dockerfile.server
                  if echo "$CHANGED_FILES" | grep -qE "(apps/server/|packages/(api|auth|db)/|Dockerfile\.server|^package\.json$|^bun\.lock$|^turbo\.json$)"; then
                      SERVER_CHANGED=true
                  fi

                  # Web changes: apps/web, packages/api, packages/auth, packages/db, Dockerfile.web
                  if echo "$CHANGED_FILES" | grep -qE "(apps/web/|packages/(api|auth|db)/|Dockerfile\.web|^package\.json$|^bun\.lock$|^turbo\.json$)"; then
                      WEB_CHANGED=true
                  fi

                  # Fumadocs changes: apps/fumadocs, Dockerfile.fumadocs
                  if echo "$CHANGED_FILES" | grep -qE "(apps/fumadocs/|Dockerfile\.fumadocs|^package\.json$|^bun\.lock$)"; then
                      FUMADOCS_CHANGED=true
                  fi

                  # For manual dispatch, always build
                  if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
                      SERVER_CHANGED=true
                      WEB_CHANGED=true
                      FUMADOCS_CHANGED=true
                  fi

                  echo "server_changed=$SERVER_CHANGED" >> $GITHUB_OUTPUT
                  echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
                  echo "fumadocs_changed=$FUMADOCS_CHANGED" >> $GITHUB_OUTPUT

                  echo "📋 Change Detection Summary"
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "Base SHA: $BASE_SHA"
                  echo "Head SHA: $HEAD_SHA"
                  echo "Changed files count: $(echo "$CHANGED_FILES" | wc -l)"
                  echo ""
                  echo "🔍 Services to build:"
                  [ "$SERVER_CHANGED" = "true" ] && echo "  ✅ server" || echo "  ⏭️  server (skipped)"
                  [ "$WEB_CHANGED" = "true" ] && echo "  ✅ web" || echo "  ⏭️  web (skipped)"
                  [ "$FUMADOCS_CHANGED" = "true" ] && echo "  ✅ fumadocs" || echo "  ⏭️  fumadocs (skipped)"
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            - name: Check if service should be built
              id: should_build
              run: |
                  case "${{ matrix.service }}" in
                      server)
                          SHOULD_BUILD="${{ steps.changes.outputs.server_changed }}"
                          ;;
                      web)
                          SHOULD_BUILD="${{ steps.changes.outputs.web_changed }}"
                          ;;
                      fumadocs)
                          SHOULD_BUILD="${{ steps.changes.outputs.fumadocs_changed }}"
                          ;;
                  esac
                  echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
                  if [ "$SHOULD_BUILD" == "true" ]; then
                      echo "✅ Building ${{ matrix.service }} - changes detected"
                  else
                      echo "⏭️  Skipping ${{ matrix.service }} - no relevant changes"
                  fi

            - name: Set up Docker Buildx
              if: steps.should_build.outputs.should_build == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              if: steps.should_build.outputs.should_build == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              if: steps.should_build.outputs.should_build == 'true'
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/openplane-${{ matrix.service }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              if: steps.should_build.outputs.should_build == 'true'
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile.${{ matrix.service }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: linux/amd64
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
