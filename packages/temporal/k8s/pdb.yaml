apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: canvas-worker-pdb
  namespace: openbeam
  labels:
    app.kubernetes.io/name: canvas-worker
    app.kubernetes.io/component: temporal-worker
    app.kubernetes.io/part-of: openbeam
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: canvas-worker
