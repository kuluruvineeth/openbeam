apiVersion: v1
kind: Secret
metadata:
  name: temporal-worker-secrets
  namespace: openplane
  labels:
    app.kubernetes.io/name: temporal-worker
    app.kubernetes.io/component: temporal-worker
    app.kubernetes.io/part-of: openplane
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres.database.svc.cluster.local:5432/openplane"
  redis-url: "redis://:password@redis.cache.svc.cluster.local:6379"
  gcs-access-key-id: "your-gcs-access-key-id"
  gcs-secret-access-key: "your-gcs-secret-access-key"
  openai-api-key: "sk-your-openai-api-key"
  anthropic-api-key: "sk-ant-your-anthropic-api-key"
