apiVersion: v1
kind: Service
metadata:
  name: canvas-worker-metrics
  namespace: openbeam
  labels:
    app.kubernetes.io/name: canvas-worker
    app.kubernetes.io/component: temporal-worker
    app.kubernetes.io/part-of: openbeam
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9464"
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: canvas-worker
---
