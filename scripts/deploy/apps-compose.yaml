services:
  server:
    image: 'ghcr.io/kuluruvineeth/openbeam-server:latest'
    container_name: openbeam-server
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WEB_URL=${WEB_URL}
      - SERVER_URL=${SERVER_URL}
      - WEB_APP_URL=${WEB_URL}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - VESPA_URL=http://vespa:8080
      - TEMPORAL_ADDRESS=temporal:7233
      - ENGINE_URL=http://engine-cpu:8000
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GCS_ENDPOINT=http://minio:9000
      - GCS_ACCESS_KEY_ID=${GCS_ACCESS_KEY_ID}
      - GCS_SECRET_ACCESS_KEY=${GCS_SECRET_ACCESS_KEY}
      - GCS_BUCKET=${GCS_BUCKET}
      - GCS_REGION=${GCS_REGION}
      - GCS_PUBLIC_ENDPOINT=${GCS_PUBLIC_ENDPOINT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_ORGANIZATION=${OPENAI_ORGANIZATION}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - PUBSUB_AUDIENCE=${PUBSUB_AUDIENCE}
      - TWELVELABS_API_KEY=${TWELVELABS_API_KEY}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD-SHELL
        - bun run -e "fetch('http://localhost:3000/').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - default
      - openbeam

  web:
    image: 'ghcr.io/kuluruvineeth/openbeam-web:latest'
    container_name: openbeam-web
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SERVER_URL=${SERVER_URL}
      - NEXT_PUBLIC_WEB_URL=${WEB_URL}
      - SERVER_INTERNAL_URL=http://server:3000
    ports:
      - '3001:3001'
    healthcheck:
      test:
        - CMD-SHELL
        - bun run -e "fetch('http://localhost:3001/').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - default
      - openbeam

  website:
    image: 'ghcr.io/kuluruvineeth/openbeam-website:latest'
    container_name: openbeam-website
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
    ports:
      - '3003:3002'
    healthcheck:
      test:
        - CMD-SHELL
        - bun run -e "fetch('http://localhost:3002/').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - default
      - openbeam

  worker:
    image: 'ghcr.io/kuluruvineeth/openbeam-worker:latest'
    container_name: openbeam-worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - VESPA_URL=http://vespa:8080
      - TEMPORAL_ADDRESS=temporal:7233
      - ENGINE_URL=http://engine-cpu:8000
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GCS_ENDPOINT=http://minio:9000
      - GCS_ACCESS_KEY_ID=${GCS_ACCESS_KEY_ID}
      - GCS_SECRET_ACCESS_KEY=${GCS_SECRET_ACCESS_KEY}
      - GCS_BUCKET=${GCS_BUCKET}
      - GCS_REGION=${GCS_REGION}
      - GCS_PUBLIC_ENDPOINT=${GCS_PUBLIC_ENDPOINT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - TWELVELABS_API_KEY=${TWELVELABS_API_KEY}
      - HEALTH_PORT=9092
      - METRICS_PORT=9091
    healthcheck:
      test:
        - CMD-SHELL
        - bun run -e "fetch('http://localhost:9092/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    networks:
      - default
      - openbeam

  engine-cpu:
    image: 'ghcr.io/kuluruvineeth/openbeam-engine:latest'
    container_name: openbeam-engine-cpu
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - CPU_PORT=8000
      - CPU_WORKERS=4
      - REDIS_URL=redis://redis:6379
      - SECURITY_REQUIRE_AUTH=false
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    networks:
      - default
      - openbeam

networks:
  default:
    name: openbeam-apps
  openbeam:
    external: true
