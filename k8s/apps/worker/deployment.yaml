apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: openplane
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: openplane/worker-dev:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
              name: metrics
            - containerPort: 9092
              name: health
          envFrom:
            - configMapRef:
                name: openplane-env
          env:
            - name: SANDBOX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: SANDBOX_API_TOKEN
          startupProbe:
            httpGet:
              path: /health/live
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9092
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9092
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
