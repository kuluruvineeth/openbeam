apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: openbeam
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      initContainers:
        - name: migrate
          image: openbeam/server-dev:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cd /app/packages/db && bunx prisma generate && bunx prisma migrate deploy"]
          envFrom:
            - configMapRef:
                name: openbeam-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: server
          image: openbeam/server-dev:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: openbeam-env
          env:
            - name: SANDBOX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: SANDBOX_API_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
