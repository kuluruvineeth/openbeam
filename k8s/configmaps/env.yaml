apiVersion: v1
kind: ConfigMap
metadata:
  name: openbeam-env
  namespace: openbeam
data:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/openbeam"
  REDIS_URL: "redis://redis:6379"
  VESPA_URL: "http://vespa:8080"
  TEMPORAL_ADDRESS: "temporal:7233"
  ENGINE_URL: "http://engine-cpu:8000"
  GCS_ENDPOINT: "http://minio:9000"
  GCS_ACCESS_KEY_ID: "minioadmin"
  GCS_SECRET_ACCESS_KEY: "minioadmin"
  GCS_BUCKET: "openbeam-files"
  GCS_FORCE_PATH_STYLE: "true"
  NODE_ENV: "development"
  LOG_LEVEL: "debug"
  LIVEKIT_URL: "ws://livekit:7880"
  WEB_URL: "http://localhost:3001"
  SERVER_URL: "http://localhost:3000"
  CORS_ORIGIN: "http://localhost:3001"
  SANDBOX_API_BASE_URL: "http://sandbox-gateway:3800"
  SANDBOX_DEFAULT_PROVIDER: "daytona"
  SANDBOX_REQUIRE_TEAM_ID: "true"
  SANDBOX_RATE_LIMIT_ENABLED: "true"
  SANDBOX_RATE_LIMIT_WINDOW_MS: "60000"
  SANDBOX_RATE_LIMIT_MAX_REQUESTS: "240"
  SANDBOX_RATE_LIMIT_MAX_EXEC_REQUESTS: "90"
  SANDBOX_RATE_LIMIT_MAX_MUTATION_REQUESTS: "120"
  SANDBOX_RATE_LIMIT_STORE: "memory"
  SANDBOX_RATE_LIMIT_KEY_PREFIX: "openbeam:sandbox:ratelimit"
  SANDBOX_OWNERSHIP_STORE: "memory"
  SANDBOX_OWNERSHIP_KEY_PREFIX: "openbeam:sandbox:ownership"
  SANDBOX_OWNERSHIP_TTL_MS: "604800000"
  SANDBOX_API_PROVIDER: "daytona"
  DAYTONA_API_URL: ""
  DAYTONA_TARGET: ""
  DAYTONA_WORKDIR: "/home/daytona"
  DAYTONA_TEAM_PREFIX: "op"
