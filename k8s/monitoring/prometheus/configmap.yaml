apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: openbeam
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: "server"
        static_configs:
          - targets: ["server:3000"]
      - job_name: "worker"
        static_configs:
          - targets: ["worker:9091"]
      - job_name: "engine-cpu"
        static_configs:
          - targets: ["engine-cpu:8000"]
        metrics_path: /v1/metrics
