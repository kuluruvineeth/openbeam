apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: openbeam
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.10
          ports:
            - containerPort: 3100
          args: ["-config.file=/etc/loki/local-config.yaml"]
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki/local-config.yaml
              subPath: loki-config.yml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: openbeam
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
