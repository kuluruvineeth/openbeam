{{- if .Values.services.engine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openplane.engineName" . }}
  labels:
    {{- include "openplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.services.engine.replicaCount }}
  selector:
    matchLabels:
      {{- include "openplane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        {{- include "openplane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: engine
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: engine
          image: {{ printf "%s:%s" .Values.services.engine.image.repository .Values.services.engine.image.tag | quote }}
          imagePullPolicy: {{ .Values.services.engine.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.engine.service.targetPort }}
              name: http
          env:
            {{- range $key, $value := .Values.services.engine.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.services.engine.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.services.engine.startupProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.services.engine.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.services.engine.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.services.engine.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.services.engine.startupProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.services.engine.readinessProbe.path }}
              port: http
            periodSeconds: {{ .Values.services.engine.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.services.engine.readinessProbe.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.services.engine.livenessProbe.path }}
              port: http
            periodSeconds: {{ .Values.services.engine.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.services.engine.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.services.engine.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.services.engine.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
