{{- if .Values.services.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openbeam.serverName" . }}
  labels:
    {{- include "openbeam.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.services.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "openbeam.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "openbeam.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.workloadIdentities.app.name | default "default" }}
      {{- if .Values.services.server.initMigrations.enabled }}
      initContainers:
        - name: migrate
          image: {{ include "openbeam.image" (dict "global" .Values.global.image "image" .Values.services.server.image) | quote }}
          imagePullPolicy: {{ .Values.services.server.image.pullPolicy }}
          command:
            {{- toYaml .Values.services.server.initMigrations.command | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "openbeam.configMapName" . }}
          {{- with .Values.services.server.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      {{- end }}
      containers:
        - name: server
          image: {{ include "openbeam.image" (dict "global" .Values.global.image "image" .Values.services.server.image) | quote }}
          imagePullPolicy: {{ .Values.services.server.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.server.service.targetPort }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "openbeam.configMapName" . }}
          env:
            - name: SANDBOX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openbeam.sandboxSecretName" . }}
                  key: SANDBOX_API_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "openbeam.appSecretName" . }}
                  key: JWT_SECRET
            {{- with .Values.services.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.services.server.startupProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.services.server.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.services.server.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.services.server.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.services.server.startupProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.services.server.readinessProbe.path }}
              port: http
            periodSeconds: {{ .Values.services.server.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.services.server.readinessProbe.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.services.server.livenessProbe.path }}
              port: http
            periodSeconds: {{ .Values.services.server.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.services.server.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.services.server.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.services.server.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
