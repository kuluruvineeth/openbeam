{{- if .Values.sandboxSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openbeam.sandboxSecretName" . }}
  labels:
    {{- include "openbeam.labels" . | nindent 4 }}
type: Opaque
stringData:
  SANDBOX_API_TOKEN: {{ .Values.sandboxSecret.token | quote }}
  SANDBOX_REDIS_URL: {{ .Values.sandboxSecret.redisUrl | quote }}
  DAYTONA_API_KEY: {{ .Values.sandboxSecret.daytonaApiKey | quote }}
  DAYTONA_JWT_TOKEN: {{ .Values.sandboxSecret.daytonaJwtToken | quote }}
  DAYTONA_ORGANIZATION_ID: {{ .Values.sandboxSecret.daytonaOrganizationId | quote }}
{{- end }}
