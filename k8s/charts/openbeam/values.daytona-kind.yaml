env:
  DAYTONA_API_URL: "http://daytona-api.daytona.svc.cluster.local:3000/api"

sandboxGateway:
  gateway:
    defaultProvider: daytona
    daytona:
      apiUrl: "http://daytona-api.daytona.svc.cluster.local:3000/api"

daytona:
  enabled: true
  fullnameOverride: daytona
  baseDomain: "daytona.local"
  services:
    api:
      ingress:
        enabled: false
        tls: false
      env:
        ENVIRONMENT: "development"
        SKIP_USER_EMAIL_VERIFICATION: "true"
        DASHBOARD_URL: "http://localhost:3000/dashboard"
        DASHBOARD_BASE_API_URL: "http://localhost:3000"
        RUNNER_MANAGER_API_KEY: "openbeam-runner-manager-key"
    proxy:
      ingress:
        enabled: false
        tls: false
      env:
        PROXY_PROTOCOL: "http"
        PROXY_API_KEY: "openbeam-proxy-key"
    sshGateway:
      enabled: false
    runnermanager:
      enabled: true
      env:
        ENVIRONMENT: "development"
        PROVIDER_TYPE: "kubernetes"
        LOG_LEVEL: "debug"
        POD_WAIT_TIMEOUT: "600"
        API_TOKEN: "openbeam-runner-manager-key"
        SYSTEM_API_TOKEN: "openbeam-system-api-token"
        API_KEY: "openbeam-runner-api-key"
        REGION_ID: "kind"
        SERVER_URL: "http://daytona-api.daytona.svc.cluster.local:3000/api"
    runner:
      enabled: true
      env:
        ENVIRONMENT: "development"
        LOG_LEVEL: "debug"
        CONTAINER_RUNTIME: "containerd"
        RESOURCE_LIMITS_DISABLED: "true"
        SSH_GATEWAY_ENABLE: "false"
        API_TOKEN: "openbeam-runner-api-key"
        SYSTEM_API_TOKEN: "openbeam-system-api-token"
        DAYTONA_API_URL: "http://daytona-api.daytona.svc.cluster.local:3000/api"
        SERVER_URL: "http://daytona-api.daytona.svc.cluster.local:3000/api"
      dockerInstaller:
        enabled: false

  postgresql:
    enabled: true
    primary:
      persistence:
        enabled: false

  redis:
    enabled: true
    auth:
      enabled: false
    persistence:
      enabled: false
    replica:
      replicaCount: 0

  harbor:
    enabled: true
    expose:
      type: clusterIP
      tls:
        enabled: false
    externalURL: "http://daytona-harbor-core.daytona.svc.cluster.local"
    persistence:
      enabled: false
    trivy:
      enabled: false

  minio:
    enabled: false

  pgadmin4:
    enabled: false

  dex:
    enabled: true
    ingress:
      enabled: false
      tls: false
    persistence:
      enabled: false
