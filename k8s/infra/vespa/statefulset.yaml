apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vespa
  namespace: openbeam
  labels:
    app: vespa
spec:
  replicas: 1
  serviceName: vespa
  selector:
    matchLabels:
      app: vespa
  template:
    metadata:
      labels:
        app: vespa
    spec:
      containers:
        - name: vespa
          image: vespaengine/vespa:8
          env:
            - name: VESPA_CONFIGSERVERS
              value: "vespa-0.vespa.openbeam.svc.cluster.local"
            - name: VESPA_CONFIGSERVER_JVMARGS
              value: "-Xms256m -Xmx1g"
            - name: VESPA_IGNORE_NOT_ENOUGH_MEMORY
              value: "true"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 19071
              name: config
          startupProbe:
            httpGet:
              path: /state/v1/health
              port: 19071
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 180
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /state/v1/health
              port: 19071
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /state/v1/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "3"
              memory: 8Gi
          volumeMounts:
            - name: vespa-data
              mountPath: /opt/vespa/var
  volumeClaimTemplates:
    - metadata:
        name: vespa-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Ti
