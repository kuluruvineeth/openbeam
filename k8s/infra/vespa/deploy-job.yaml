apiVersion: batch/v1
kind: Job
metadata:
  name: vespa-deploy
  namespace: openplane
  labels:
    app: vespa-deploy
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: vespa-deploy
    spec:
      containers:
        - name: deployer
          image: openplane/vespa-deployer
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for Vespa config server..."
              for i in $(seq 1 60); do
                if curl -sf http://vespa:19071/state/v1/health > /dev/null 2>&1; then
                  echo "Vespa config server ready"
                  break
                fi
                if [ $i -eq 60 ]; then
                  echo "Timeout waiting for Vespa config server"
                  exit 1
                fi
                echo "Attempt $i/60 - waiting..."
                sleep 5
              done
              cd /vespa
              sh ./deploy.sh vespa 19071
      restartPolicy: OnFailure
