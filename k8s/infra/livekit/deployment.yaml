apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: openbeam
  labels:
    app: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
        - name: livekit
          image: livekit/livekit-server:latest
          ports:
            - containerPort: 7880
          args: ["--config", "/etc/livekit/livekit.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: livekit-config
