services:
  - type: web
    name: openplane-server
    runtime: docker
    dockerfilePath: ./Dockerfile.server.render
    dockerContext: .
    registryCredential:
      fromRegistryCreds:
        name: ghcr-credentials
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: openplane-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: false

  - type: web
    name: openplane-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web.render
    dockerContext: .
    registryCredential:
      fromRegistryCreds:
        name: ghcr-credentials
    plan: free
    envVars:
      - key: NEXT_PUBLIC_SERVER_URL
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: false

  - type: web
    name: openplane-docs
    runtime: docker
    dockerfilePath: ./Dockerfile.fumadocs.render
    dockerContext: .
    registryCredential:
      fromRegistryCreds:
        name: ghcr-credentials
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: false

databases:
  - name: openplane-db
    plan: free
    databaseName: openplane
    user: openplane
